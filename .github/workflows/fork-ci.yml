name: Fork CI

# Lightweight gate for this fork: the upstream ci.yml targets self-hosted
# enterprise runners and repo variables this fork does not own. This workflow
# only proves the tree compiles and builds on a hosted runner.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  verify:
    name: typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Build check
        run: pnpm run build:check